name: Sincronización Automática de Fichajes Girona (gruposifuapp)

on:
  schedule:
    # Ejecución automática cada 30 minutos de lunes a viernes en horario laboral (6:00 a 20:30 UTC)
    - cron: '*/30 6-20 * * 1-5'
  workflow_dispatch:
    # Permite ejecutar manualmente la sincronización desde GitHub con un clic

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright openpyxl
          playwright install chromium --with-deps

      - name: 🔄 Ejecutar auditoría masiva de fichajes Girona v2
        run: |
          python fichajes_sync_gcalidad_app.py

      - name: 💾 Guardar y publicar datos actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fichajes_contraste_girona.json fichajes_contraste_data.js fichajes_historico/
          if git diff --staged --quiet; then
            echo "Sin cambios en los fichajes."
          else
            git commit -m "Auto-sync fichajes Girona [gruposifuapp.gcalidad.com] $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
